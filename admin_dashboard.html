<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم مدير النظام - SnapJo</title>
</head>
<body style="font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px;">

    <h1 style="color: #333;">لوحة تحكم الإدارة الشاملة (Admin)</h1>
    
    <div style="display: flex; gap: 20px; margin-bottom: 40px;">
        <div style="background: white; padding: 20px; flex: 1; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-right: 5px solid #f18732;">
            <h3>عدد المصورين</h3>
            <p style="font-size: 1.8rem; font-weight: bold; color: #f18732; margin: 0;">54 مصور</p>
        </div>
        <div style="background: white; padding: 20px; flex: 1; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-right: 5px solid #28a745;">
            <h3>إجمالي الحجوزات</h3>
            <p style="font-size: 1.8rem; font-weight: bold; color: #28a745; margin: 0;">182 حجز</p>
        </div>
    </div>

    <div style="background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <h2 style="margin-top: 0;">إدارة طلبات المصورين الجدد</h2>
        <table style="width: 100%; border-collapse: collapse; text-align: right;">
            <thead>
                <tr style="background: #f7f5f0;">
                    <th style="padding: 12px; border-bottom: 2px solid #ddd;">اسم المصور</th>
                    <th style="padding: 12px; border-bottom: 2px solid #ddd;">التخصص</th>
                    <th style="padding: 12px; border-bottom: 2px solid #ddd;">المنطقة</th>
                    <th style="padding: 12px; border-bottom: 2px solid #ddd;">الإجراء</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td style="padding: 12px; border-bottom: 1px solid #ddd;">خالد عبيدات</td>
                    <td style="padding: 12px; border-bottom: 1px solid #ddd;">بورتريه</td>
                    <td style="padding: 12px; border-bottom: 1px solid #ddd;">إربد</td>
                    <td style="padding: 12px; border-bottom: 1px solid #ddd;">
                        <button style="background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">قبول</button>
                        <button style="background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">حظر</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
